<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteFlow</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-alt: #eef3ff;
        --panel-soft: #f1f5f9;
        --border: #dfe6f1;
        --text: #172033;
        --muted: #64748b;
        --accent: #4f46e5;
        --accent-strong: #3730a3;
        --success: #0f9f6e;
        --warning: #d97706;
        --danger: #dc2626;
        --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
        --radius: 18px;
      }

      html[data-theme="dark"] {
        --bg: #0b1120;
        --panel: #111827;
        --panel-alt: #162033;
        --panel-soft: #1c2940;
        --border: #2d3b52;
        --text: #e5edf8;
        --muted: #9ab1ca;
        --accent: #8b9cff;
        --accent-strong: #b5c0ff;
        --success: #32d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --shadow: 0 24px 60px rgba(2, 6, 23, 0.6);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        transition: background 0.2s ease, color 0.2s ease;
      }

      button, input, textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 320px 1fr;
        height: 100vh;
      }

      .sidebar {
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .sb-header {
        padding: 18px 16px 12px;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .count-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 26px;
        border-radius: 999px;
        background: var(--panel-alt);
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .new-note {
        width: 100%;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        padding: 12px 14px;
        border-radius: 14px;
        font-weight: 700;
        box-shadow: var(--shadow);
      }

      .search-box {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 9px 12px;
      }

      .search-box input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
      }

      .search-box input::placeholder {
        color: var(--muted);
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }

      .tab {
        padding: 8px 10px;
        border-radius: 10px;
        color: var(--muted);
        font-weight: 700;
        background: transparent;
      }

      .tab.active {
        background: var(--panel-soft);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--border);
      }

      .notes-list {
        flex: 1;
        overflow-y: auto;
        padding: 14px 10px 12px;
      }

      .note-item {
        position: relative;
        padding: 12px 12px 10px;
        border-radius: 14px;
        margin-bottom: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }

      .note-item:hover {
        background: var(--panel-soft);
      }

      .note-item.active {
        background: var(--panel-alt);
        border-color: var(--border);
      }

      .note-item.pinned::before {
        content: "📌";
        position: absolute;
        right: 10px;
        top: 10px;
        font-size: 0.7rem;
      }

      .note-item h3 {
        margin: 0 0 6px;
        font-size: 0.98rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 22px;
      }

      .note-item p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .note-item footer {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .note-item .tag {
        display: inline-block;
        background: rgba(79, 70, 229, 0.12);
        color: var(--accent);
        border-radius: 999px;
        padding: 2px 8px;
        font-weight: 600;
      }

      .empty-state {
        padding: 32px 18px;
        text-align: center;
        color: var(--muted);
      }

      .sidebar-footer {
        display: flex;
        gap: 8px;
        padding: 12px 16px 16px;
        border-top: 1px solid var(--border);
      }

      .ghost-btn,
      .soft-btn,
      .danger-btn {
        border-radius: 12px;
        padding: 9px 12px;
        font-weight: 700;
      }

      .ghost-btn {
        background: var(--panel-soft);
        color: var(--text);
      }

      .soft-btn {
        background: rgba(79, 70, 229, 0.08);
        color: var(--accent);
      }

      .danger-btn {
        background: rgba(220, 38, 38, 0.08);
        color: var(--danger);
      }

      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      .note-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        padding: 20px 26px 14px;
      }

      .title-wrap {
        flex: 1;
        min-width: 0;
      }

      .title-input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--text);
      }

      .title-input::placeholder {
        color: var(--muted);
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .meta-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
      }

      .header-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--muted);
        font-size: 1rem;
      }

      .icon-btn.primary {
        background: rgba(79, 70, 229, 0.08);
        color: var(--accent);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 26px;
        border-bottom: 1px solid var(--border);
      }

      .tool-btn {
        min-width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--muted);
        font-weight: 700;
      }

      .tool-btn[data-action="h1"],
      .tool-btn[data-action="h2"] {
        font-size: 0.9rem;
      }

      .editor-wrap {
        flex: 1;
        min-height: 0;
        padding: 18px 26px 26px;
      }

      .editor-wrap textarea,
      .preview {
        width: 100%;
        height: 100%;
        max-width: 860px;
        margin: 0 auto;
        display: block;
      }

      .editor-wrap textarea {
        resize: none;
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 18px;
        color: var(--text);
        font-size: 1rem;
        line-height: 1.75;
        padding: 22px 20px;
        outline: none;
        box-shadow: inset 0 1px 1px rgba(15, 23, 42, 0.04);
      }

      .editor-wrap textarea::placeholder {
        color: var(--muted);
      }

      .preview {
        display: none;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px 22px 28px;
        overflow: auto;
        line-height: 1.75;
      }

      .preview.visible {
        display: block;
      }

      .preview h1, .preview h2, .preview h3,
      .preview h4, .preview h5, .preview h6 {
        margin: 1.2em 0 0.5em;
        line-height: 1.2;
      }

      .preview h1 { font-size: 2rem; }
      .preview h2 { font-size: 1.5rem; }
      .preview h3 { font-size: 1.2rem; }
      .preview p { margin: 0.75em 0; }
      .preview ul, .preview ol { padding-left: 1.5rem; }
      .preview blockquote {
        margin: 1em 0;
        padding-left: 16px;
        border-left: 4px solid var(--accent);
        color: var(--muted);
      }
      .preview code {
        padding: 0.15rem 0.35rem;
        border-radius: 6px;
        background: var(--panel-soft);
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
      .preview pre {
        background: var(--panel-soft);
        border: 1px solid var(--border);
        padding: 12px 14px;
        border-radius: 12px;
        overflow: auto;
      }
      .preview pre code {
        background: transparent;
        padding: 0;
      }
      .preview table {
        width: 100%;
        border-collapse: collapse;
      }
      .preview th, .preview td {
        border: 1px solid var(--border);
        padding: 8px 10px;
        text-align: left;
      }
      .preview a {
        color: var(--accent);
      }
      .preview strong { font-weight: 800; }
      .preview em { font-style: italic; }
      .preview del { text-decoration: line-through; }
      .preview mark {
        background: rgba(251, 191, 36, 0.35);
        color: inherit;
      }

      .context-menu {
        position: absolute;
        top: 110px;
        right: 26px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 14px;
        padding: 8px;
        display: none;
        z-index: 10;
      }

      .context-menu.show {
        display: block;
      }

      .context-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        border-radius: 10px;
        color: var(--text);
      }

      .context-menu button:hover {
        background: var(--panel-soft);
      }

      .context-menu .danger {
        color: var(--danger);
      }

      @media (max-width: 920px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }

        .note-header {
          flex-direction: column;
          gap: 12px;
        }

        .header-actions {
          width: 100%;
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sb-header">
          <div class="brand">
            <h1>NoteFlow</h1>
            <span class="count-pill" id="countPill">0</span>
          </div>

          <button class="new-note" id="newNoteBtn">＋ New note</button>

          <label class="search-box" aria-label="Search notes">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="Search notes…" />
          </label>

          <div class="tabs" id="tabs">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="pinned">Pinned</button>
            <button class="tab" data-filter="trash">Trash</button>
          </div>
        </div>

        <div class="notes-list" id="notesList"></div>

        <div class="sidebar-footer">
          <button class="ghost-btn" id="themeToggleBtn">🌙</button>
          <button class="soft-btn" id="backupBtn">Backup</button>
          <button class="danger-btn" id="emptyTrashBtn">Clear trash</button>
        </div>
      </aside>

      <main class="main">
        <header class="note-header">
          <div class="title-wrap">
            <input id="titleInput" class="title-input" placeholder="Untitled note" />
            <div class="meta-row">
              <span class="meta-pill" id="updatedAt">Just now</span>
              <span class="meta-pill" id="wordCount">0 words</span>
              <span class="meta-pill" id="statusPill">Saved locally</span>
            </div>
          </div>

          <div class="header-actions">
            <button class="icon-btn primary" id="togglePreviewBtn" title="Toggle preview">◉</button>
            <button class="icon-btn" id="focusModeBtn" title="Focus mode">☰</button>
            <button class="icon-btn" id="moreMenuBtn" title="More actions">⋯</button>
          </div>
        </header>

        <div class="toolbar">
          <button class="tool-btn" data-action="bold" title="Bold"><strong>B</strong></button>
          <button class="tool-btn" data-action="italic" title="Italic"><em>I</em></button>
          <button class="tool-btn" data-action="h1" title="Heading 1">H1</button>
          <button class="tool-btn" data-action="h2" title="Heading 2">H2</button>
          <button class="tool-btn" data-action="bullet" title="Bullet list">• List</button>
          <button class="tool-btn" data-action="quote" title="Quote">❝</button>
          <button class="tool-btn" data-action="code" title="Code block">&lt;/&gt;</button>
          <button class="tool-btn" data-action="link" title="Link">🔗</button>
        </div>

        <div class="editor-wrap">
          <textarea id="editor" spellcheck="true" placeholder="Write something beautiful…"></textarea>
          <div id="preview" class="preview" aria-live="polite"></div>
        </div>
      </main>
    </div>

    <div class="context-menu" id="contextMenu">
      <button data-menu="duplicate">Duplicate</button>
      <button data-menu="export">Export .md</button>
      <button data-menu="togglePin">Pin / Unpin</button>
      <button data-menu="trash" class="danger">Delete</button>
      <button data-menu="restore">Restore</button>
    </div>

    <script>
      const STORAGE_KEY = 'noteflow:notes:v1';
      const THEME_KEY = 'noteflow:theme:v1';
      const state = {
        notes: loadNotes(),
        selectedId: null,
        filter: 'all',
        query: '',
        preview: false,
        focusMode: false,
      };

      const els = {
        notesList: document.getElementById('notesList'),
        titleInput: document.getElementById('titleInput'),
        editor: document.getElementById('editor'),
        preview: document.getElementById('preview'),
        searchInput: document.getElementById('searchInput'),
        countPill: document.getElementById('countPill'),
        updatedAt: document.getElementById('updatedAt'),
        wordCount: document.getElementById('wordCount'),
        statusPill: document.getElementById('statusPill'),
        contextMenu: document.getElementById('contextMenu'),
        moreMenuBtn: document.getElementById('moreMenuBtn'),
        togglePreviewBtn: document.getElementById('togglePreviewBtn'),
        focusModeBtn: document.getElementById('focusModeBtn'),
      };

      function loadNotes() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function persistNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes));
      }

      function uid() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return 'note-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      }

      function makeNote() {
        return {
          id: uid(),
          title: 'Untitled note',
          body: '',
          createdAt: Date.now(),
          updatedAt: Date.now(),
          pinned: false,
          trashed: false,
        };
      }

      function getSelected() {
        return state.notes.find(note => note.id === state.selectedId) || null;
      }

      function saveCurrentNote() {
        const note = getSelected();
        if (!note) return;
        note.title = els.titleInput.value.trim() || 'Untitled note';
        note.body = els.editor.value;
        note.updatedAt = Date.now();
        persistNotes();
        renderNotesList();
        updateMeta();
      }

      function updateMeta() {
        const note = getSelected();
        if (!note) {
          els.updatedAt.textContent = 'No note selected';
          els.wordCount.textContent = '0 words';
          return;
        }

        const words = countWords(note.body);
        els.updatedAt.textContent = formatDate(note.updatedAt);
        els.wordCount.textContent = `${words} word${words === 1 ? '' : 's'}`;
        els.statusPill.textContent = note.trashed ? 'In trash' : 'Saved locally';
      }

      function countWords(text) {
        const val = (text || '').trim();
        if (!val) return 0;
        return val.split(/\s+/).length;
      }

      function formatDate(ts) {
        const date = new Date(ts);
        return date.toLocaleString([], {
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
        });
      }

      function createNote() {
        const newNote = makeNote();
        state.notes.unshift(newNote);
        state.selectedId = newNote.id;
        persistNotes();
        renderAll();
      }

      function filteredNotes() {
        return state.notes.filter(note => {
          const matchesFilter =
            state.filter === 'all'
              ? !note.trashed
              : state.filter === 'pinned'
                ? note.pinned && !note.trashed
                : note.trashed;

          const matchQuery = !state.query || `${note.title} ${note.body}`.toLowerCase().includes(state.query.toLowerCase());
          return matchesFilter && matchQuery;
        });
      }

      function renderNotesList() {
        const items = filteredNotes();
        els.countPill.textContent = String(items.length);

        if (!items.length) {
          els.notesList.innerHTML = '<div class="empty-state">No notes match this view.</div>';
          return;
        }

        els.notesList.innerHTML = items.map(note => `
          <article class="note-item ${note.id === state.selectedId ? 'active' : ''} ${note.pinned ? 'pinned' : ''}" data-id="${note.id}">
            <h3>${escapeHtml(note.title || 'Untitled note')}</h3>
            <p>${escapeHtml((note.body || '').replace(/\n/g, ' ').slice(0, 120) || 'Start writing…')}</p>
            <footer>
              <span>${note.pinned ? '<span class="tag">Pinned</span>' : formatDate(note.updatedAt)}</span>
              <span>${countWords(note.body)}w</span>
            </footer>
          </article>
        `).join('');

        els.notesList.querySelectorAll('.note-item').forEach(item => {
          item.addEventListener('click', () => {
            state.selectedId = item.dataset.id;
            renderAll();
          });
        });
      }

      function renderEditor() {
        const note = getSelected();
        if (!note) {
          els.titleInput.value = '';
          els.editor.value = '';
          els.preview.innerHTML = '';
          return;
        }

        els.titleInput.value = note.title;
        els.editor.value = note.body;
        els.preview.innerHTML = renderMarkdown(note.body);
      }

      function renderAll() {
        const note = getSelected();
        if (!note && state.notes.length > 0 && !state.notes.some(n => n.id === state.selectedId)) {
          state.selectedId = state.notes[0].id;
        }

        renderNotesList();
        renderEditor();
        updateMeta();
        syncPreview();
      }

      function syncPreview() {
        const note = getSelected();
        if (!note) {
          els.preview.classList.remove('visible');
          return;
        }

        els.preview.innerHTML = renderMarkdown(note.body);
        els.preview.classList.toggle('visible', state.preview);
        els.editor.style.display = state.preview ? 'none' : 'block';
      }

      function renderMarkdown(md) {
        const escaped = escapeHtml(md || '');
        const normalized = escaped
          .replace(/\r\n/g, '\n')
          .replace(/\n{3,}/g, '\n\n');

        const blocks = normalized.split('\n\n');
        return blocks.map(block => {
          if (!block.trim()) return '';

          if (/^```/.test(block.trim())) {
            const content = block.replace(/^```[\s\S]*?\n/, '').replace(/```$/, '');
            return `<pre><code>${content}</code></pre>`;
          }

          if (/^> /.test(block)) {
            return `<blockquote>${block.replace(/^> /gm, '')}</blockquote>`;
          }

          if (/^\s*[-*+] /.test(block)) {
            const items = block.split('\n').map(line => line.replace(/^\s*[-*+] /, '')).map(item => `<li>${inlineMarkdown(item)}</li>`).join('');
            return `<ul>${items}</ul>`;
          }

          if (/^\s*\d+\. /.test(block)) {
            const items = block.split('\n').map(line => line.replace(/^\s*\d+\. /, '')).map(item => `<li>${inlineMarkdown(item)}</li>`).join('');
            return `<ol>${items}</ol>`;
          }

          if (/^#{1,6} /.test(block)) {
            const level = block.match(/^#+/)[0].length;
            const text = block.replace(/^#{1,6} /, '');
            return `<h${level}>${inlineMarkdown(text)}</h${level}>`;
          }

          return `<p>${inlineMarkdown(block)}</p>`;
        }).join('');
      }

      function inlineMarkdown(text) {
        return escapeHtml(text)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/~~([^~]+)~~/g, '<del>$1</del>')
          .replace(/==([^=]+)==/g, '<mark>$1</mark>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
          .replace(/\n/g, '<br>');
      }

      function escapeHtml(text) {
        return String(text ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function insertMarkdown(type) {
        const textarea = els.editor;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selected = textarea.value.slice(start, end) || 'text';
        let insert = '';

        switch (type) {
          case 'bold':
            insert = `**${selected}**`;
            break;
          case 'italic':
            insert = `*${selected}*`;
            break;
          case 'h1':
            insert = `# ${selected}\n`;
            break;
          case 'h2':
            insert = `## ${selected}\n`;
            break;
          case 'bullet':
            insert = `- ${selected}\n`;
            break;
          case 'quote':
            insert = `> ${selected}\n`;
            break;
          case 'code':
            insert = `\`\`${selected}\`\`\n`;
            break;
          case 'link':
            insert = `[${selected || 'link text'}](https://example.com)`;
            break;
          default:
            return;
        }

        textarea.setRangeText(insert, start, end, 'end');
        textarea.focus();
        saveCurrentNote();
      }

      function togglePreview() {
        state.preview = !state.preview;
        syncPreview();
      }

      function focusMode() {
        state.focusMode = !state.focusMode;
        document.body.style.filter = state.focusMode ? 'contrast(1.03)' : '';
        document.querySelector('.sidebar').style.opacity = state.focusMode ? '0.7' : '1';
        els.focusModeBtn.style.background = state.focusMode ? 'rgba(79,70,229,0.12)' : '';
        els.focusModeBtn.style.color = state.focusMode ? 'var(--accent)' : '';
      }

      function duplicateCurrent() {
        const note = getSelected();
        if (!note) return;
        const clone = { ...note, id: uid(), title: `${note.title} copy`, updatedAt: Date.now(), createdAt: Date.now() };
        state.notes.unshift(clone);
        state.selectedId = clone.id;
        persistNotes();
        renderAll();
      }

      function togglePinCurrent() {
        const note = getSelected();
        if (!note) return;
        note.pinned = !note.pinned;
        saveCurrentNote();
      }

      function deleteCurrent() {
        const note = getSelected();
        if (!note) return;
        note.trashed = !note.trashed;
        if (note.trashed) {
          state.filter = 'trash';
        }
        saveCurrentNote();
        const remaining = filteredNotes();
        if (remaining.length) {
          state.selectedId = remaining[0].id;
        } else if (state.notes.filter(n => !n.trashed).length) {
          state.selectedId = state.notes.find(n => !n.trashed)?.id || null;
        } else {
          state.selectedId = null;
        }
        renderAll();
      }

      function restoreCurrent() {
        const note = getSelected();
        if (!note) return;
        note.trashed = false;
        state.filter = 'all';
        saveCurrentNote();
        renderAll();
      }

      function emptyTrash() {
        state.notes = state.notes.filter(note => !note.trashed);
        persistNotes();
        state.filter = 'all';
        if (state.notes.length) state.selectedId = state.notes[0].id;
        else state.selectedId = null;
        renderAll();
      }

      function exportCurrent() {
        const note = getSelected();
        if (!note) return;
        const blob = new Blob([`# ${note.title}\n\n${note.body}`], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${(note.title || 'note').toLowerCase().replace(/\s+/g, '-')}.md`;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function backupAll() {
        const blob = new Blob([JSON.stringify(state.notes, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'noteflow-backup.json';
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function importBackup(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const incoming = JSON.parse(String(reader.result));
            if (!Array.isArray(incoming)) throw new Error('Invalid backup');
            state.notes = incoming;
            state.selectedId = state.notes[0]?.id || null;
            persistNotes();
            renderAll();
          } catch {
            alert('That backup file is not valid JSON.');
          }
        };
        reader.readAsText(file);
      }

      function toggleTheme() {
        const root = document.documentElement;
        const current = root.getAttribute('data-theme') || 'light';
        const next = current === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
        els.themeToggleBtn.textContent = next === 'dark' ? '☀️' : '🌙';
      }

      function setupTheme() {
        const saved = localStorage.getItem(THEME_KEY) || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        els.themeToggleBtn.textContent = saved === 'dark' ? '☀️' : '🌙';
      }

      document.getElementById('newNoteBtn').addEventListener('click', createNote);
      document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
      document.getElementById('backupBtn').addEventListener('click', backupAll);
      document.getElementById('emptyTrashBtn').addEventListener('click', emptyTrash);
      els.searchInput.addEventListener('input', (event) => {
        state.query = event.target.value.trim();
        renderNotesList();
      });

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el === tab));
          state.filter = tab.dataset.filter;
          renderNotesList();
        });
      });

      els.titleInput.addEventListener('input', () => {
        const note = getSelected();
        if (!note) return;
        note.title = els.titleInput.value;
        note.updatedAt = Date.now();
        persistNotes();
        renderNotesList();
        updateMeta();
      });

      els.editor.addEventListener('input', () => {
        const note = getSelected();
        if (!note) return;
        note.body = els.editor.value;
        note.updatedAt = Date.now();
        persistNotes();
        renderNotesList();
        updateMeta();
        if (state.preview) {
          els.preview.innerHTML = renderMarkdown(note.body);
        }
      });

      document.querySelectorAll('.tool-btn').forEach(button => {
        button.addEventListener('click', () => insertMarkdown(button.dataset.action));
      });

      els.togglePreviewBtn.addEventListener('click', togglePreview);
      els.focusModeBtn.addEventListener('click', focusMode);
      els.moreMenuBtn.addEventListener('click', (event) => {
        const menu = els.contextMenu;
        menu.classList.toggle('show');
        menu.style.left = `${event.clientX - 150}px`;
        menu.style.top = `${event.clientY + 10}px`;
      });

      els.contextMenu.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const action = button.dataset.menu;
        els.contextMenu.classList.remove('show');
        if (action === 'duplicate') duplicateCurrent();
        if (action === 'export') exportCurrent();
        if (action === 'togglePin') togglePinCurrent();
        if (action === 'trash') deleteCurrent();
        if (action === 'restore') restoreCurrent();
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('#moreMenuBtn') && !event.target.closest('#contextMenu')) {
          els.contextMenu.classList.remove('show');
        }
      });

      document.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
          event.preventDefault();
          saveCurrentNote();
          els.statusPill.textContent = 'Saved';
        }

        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'b') {
          event.preventDefault();
          insertMarkdown('bold');
        }

        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'e') {
          event.preventDefault();
          togglePreview();
        }
      });

      window.addEventListener('beforeunload', saveCurrentNote);

      document.addEventListener('DOMContentLoaded', () => {
        setupTheme();
        if (state.notes.length) {
          state.selectedId = state.notes[0].id;
        }
        renderAll();
      });

      document.getElementById('backupBtn').addEventListener('dblclick', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.addEventListener('change', (event) => importBackup(event.target.files[0]));
        input.click();
      });
    </script>
  </body>
</html>
